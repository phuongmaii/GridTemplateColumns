
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS Grid Row</h1>

    <div class="controls">
        <p>Thay đổi thuộc tính <code>grid-row</code> trong file CSS để thử 3 trường hợp.</p>
    </div>

    <h2>Ví dụ: Ô 1 chiếm 2 hàng</h2>

    <div class="grid-container">
        <div class="item item1">Ô 1</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>
</body>
</html>
